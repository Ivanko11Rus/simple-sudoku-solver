<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Решатель судоку</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --cell: min(calc((100vw - 60px) / 9), 110px);
  }

  body {
    font-family: system-ui, sans-serif;
    background: #f0f2f5;
    margin: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    min-height: 100vh;
    box-sizing: border-box;
    overflow-x: hidden;
  }
  .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 0;
  }

  h2 {
    margin: 0 0 calc(var(--cell) * 0.2) 0;
    font-size: clamp(16px, calc(var(--cell) * 0.42), 28px);
    color: #333;
    text-align: center;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(9, var(--cell));
    grid-template-rows: repeat(9, var(--cell));
    border: 3px solid #222;
    background: #fff;
    user-select: none;
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--cell) * 0.48);
    font-weight: 600;
    color: #2e9e5b;           /* решение — зелёный */
    border-right: 1px solid #bbb;
    border-bottom: 1px solid #bbb;
    position: relative;
  }
  .cell.thick-right  { border-right: 3px solid #222; }
  .cell.thick-bottom { border-bottom: 3px solid #222; }
  .cell:nth-child(9n) { border-right: none; }
  .cell:nth-last-child(-n+9) { border-bottom: none; }

  .cell input {
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    text-align: center;
    font-size: calc(var(--cell) * 0.48);
    font-weight: 600;
    color: #2e9e5b;           /* решение — зелёный */
    background: transparent;
    padding: 0;
    caret-color: transparent;
  }
  .cell input:focus { background: transparent; }
  .cell input::selection { background: transparent; }

  .cell.given input {
    color: #111;              /* условия — почти чёрный */
  }

  .cell.highlight { background: #bcd7f5; }
  .cell.selected  { background: #4a90e2; }
  .cell.selected input { color: #fff; }
  .cell.conflict  { background: #ffcdd2; }

  .preview-cell {
    color: #2e9e5b;           /* в «предыдущем решении» тоже зелёный */
    background: #fafafa;
  }

  .preview-wrap { position: relative; }

  .preview-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--cell) * 0.32);
    color: #999;
    background: rgba(255,255,255,0.85);
    pointer-events: none;
    text-align: center;
    padding: 0 20px;
  }
  .preview-overlay.hidden { display: none; }

  .controls {
    margin-top: calc(var(--cell) * 0.3);
    display: flex;
    gap: calc(var(--cell) * 0.2);
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    padding: calc(var(--cell) * 0.22) calc(var(--cell) * 0.4);
    font-size: clamp(14px, calc(var(--cell) * 0.36), 22px);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #1976d2;
    color: #fff;
    font-weight: 600;
    transition: background .15s;
  }
  button:hover { background: #1565c0; }
  button.secondary { background: #78909c; }
  button.secondary:hover { background: #607d8b; }

  .status {
    margin-top: calc(var(--cell) * 0.2);
    font-size: clamp(12px, calc(var(--cell) * 0.26), 18px);
    color: #555;
    min-height: 1em;
    text-align: center;
    max-width: calc(var(--cell) * 9);
  }
  .status.error { color: #c62828; font-weight: 600; }
  .status.ok    { color: #2e7d32; font-weight: 600; }

  /* Телефоны: меньше отступы, поле почти во всю ширину */
  @media (max-width: 600px) {
    body {
      padding: 8px;
      gap: 16px;
    }
    :root {
      --cell: min(calc((100vw - 40px) / 9), 110px);
    }
  }

  /* Два поля в ряд — только на широких экранах */
  @media (min-width: 1200px) {
    body {
      flex-direction: row;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }
    :root {
      --cell: clamp(48px, 4.4vmin, 80px);
    }
  }
</style>
</head>
<body>

<div class="panel">
  <h2>Поле</h2>
  <div class="grid" id="grid"></div>
  <div class="controls">
    <button id="solveBtn">Решить</button>
    <button class="secondary" id="clearBtn">Очистить</button>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="panel">
  <h2>Предыдущее решение</h2>
  <div class="preview-wrap">
    <div class="grid" id="previewGrid"></div>
    <div class="preview-overlay" id="previewOverlay">Пока нет решения</div>
  </div>
</div>

<script>
/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
const SIZE = 9;
let board = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
let given = Array.from({length: SIZE}, () => Array(SIZE).fill(false));
let lastSolution = null;

/* ============================================================
   ЭЛЕМЕНТЫ
   ============================================================ */
const gridEl         = document.getElementById('grid');
const previewEl      = document.getElementById('previewGrid');
const previewOverlay = document.getElementById('previewOverlay');
const statusEl       = document.getElementById('status');

const cellEls    = [];
const previewEls = [];

function addThickBorders(el, r, c) {
  if (c % 3 === 2 && c !== 8) el.classList.add('thick-right');
  if (r % 3 === 2 && r !== 8) el.classList.add('thick-bottom');
}

for (let r = 0; r < SIZE; r++) {
  cellEls[r] = [];
  for (let c = 0; c < SIZE; c++) {
    const wrap = document.createElement('div');
    wrap.className = 'cell';
    addThickBorders(wrap, r, c);

    const inp = document.createElement('input');
    inp.type = 'text';
    inp.inputMode = 'numeric';
    inp.maxLength = 1;
    inp.autocomplete = 'off';
    inp.autocorrect = 'off';
    inp.spellcheck = false;
    inp.dataset.r = r;
    inp.dataset.c = c;

    inp.addEventListener('input',   () => onInputChange(r, c, inp));
    inp.addEventListener('keydown', (e) => onInputKeyDown(e, r, c));
    inp.addEventListener('focus',   () => onFocus(r, c));
    inp.addEventListener('click',   () => onFocus(r, c));

    wrap.appendChild(inp);
    gridEl.appendChild(wrap);
    cellEls[r][c] = { wrap, input: inp };
  }
}

for (let r = 0; r < SIZE; r++) {
  previewEls[r] = [];
  for (let c = 0; c < SIZE; c++) {
    const d = document.createElement('div');
    d.className = 'cell preview-cell';
    addThickBorders(d, r, c);
    previewEl.appendChild(d);
    previewEls[r][c] = d;
  }
}

/* ============================================================
   ВВОД
   ============================================================ */
function onInputChange(r, c, inp) {
  let v = inp.value.replace(/[^0-9]/g, '');
  if (v.length > 1) v = v.slice(-1);
  inp.value = v;

  const digit = v === '' ? 0 : parseInt(v, 10);
  if (digit >= 1 && digit <= 9) {
    board[r][c] = digit;
    given[r][c] = true;
  } else {
    board[r][c] = 0;
    given[r][c] = false;
  }

  cellEls[r][c].wrap.classList.toggle('given', given[r][c]);
  checkConflicts();

  if (v !== '') focusNext(r, c);
}

function onInputKeyDown(e, r, c) {
  if      (e.key === 'ArrowRight') { e.preventDefault(); moveFocus(r, c,  0,  1); }
  else if (e.key === 'ArrowLeft')  { e.preventDefault(); moveFocus(r, c,  0, -1); }
  else if (e.key === 'ArrowDown')  { e.preventDefault(); moveFocus(r, c,  1,  0); }
  else if (e.key === 'ArrowUp')    { e.preventDefault(); moveFocus(r, c, -1,  0); }
}

function focusNext(r, c) {
  let nr = r, nc = c + 1;
  if (nc >= SIZE) { nc = 0; nr++; }
  if (nr >= SIZE) { nr = 0; nc = 0; }
  const next = cellEls[nr][nc].input;
  if (next) { next.focus(); next.select(); }
}

function moveFocus(r, c, dr, dc) {
  const nr = r + dr, nc = c + dc;
  if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) return;
  cellEls[nr][nc].input.focus();
  cellEls[nr][nc].input.select();
}

/* ============================================================
   ВЫДЕЛЕНИЕ
   ============================================================ */
let selected = null;
let highlighted = [];

function onFocus(r, c) {
  selected = {r, c};
  updateHighlight();
}

function clearHighlight() {
  highlighted.forEach(({r, c}) => cellEls[r][c].wrap.classList.remove('highlight'));
  highlighted = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      cellEls[r][c].wrap.classList.remove('selected');
}

function updateHighlight() {
  clearHighlight();
  if (!selected) return;
  const {r, c} = selected;
  cellEls[r][c].wrap.classList.add('selected');

  const br = Math.floor(r / 3) * 3;
  const bc = Math.floor(c / 3) * 3;
  const add = (rr, cc) => {
    if (rr === r && cc === c) return;
    const el = cellEls[rr][cc].wrap;
    if (!el.classList.contains('highlight')) {
      el.classList.add('highlight');
      highlighted.push({r: rr, c: cc});
    }
  };
  for (let i = 0; i < SIZE; i++) { add(r, i); add(i, c); }
  for (let i = 0; i < 3; i++)
    for (let j = 0; j < 3; j++) add(br + i, bc + j);
}

/* ============================================================
   ПРОВЕРКА КОНФЛИКТОВ
   ============================================================ */
function checkConflicts() {
  const bad = new Set();
  const key = (r, c) => r * 9 + c;

  for (let r = 0; r < SIZE; r++) {
    const seen = {};
    for (let c = 0; c < SIZE; c++) {
      const v = board[r][c]; if (!v) continue;
      if (seen[v] !== undefined) { bad.add(key(r, c)); bad.add(key(r, seen[v])); }
      else seen[v] = c;
    }
  }
  for (let c = 0; c < SIZE; c++) {
    const seen = {};
    for (let r = 0; r < SIZE; r++) {
      const v = board[r][c]; if (!v) continue;
      if (seen[v] !== undefined) { bad.add(key(r, c)); bad.add(key(seen[v], c)); }
      else seen[v] = r;
    }
  }
  for (let br = 0; br < 3; br++) for (let bc = 0; bc < 3; bc++) {
    const seen = {};
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
      const r = br*3+i, c = bc*3+j, v = board[r][c];
      if (!v) continue;
      if (seen[v] !== undefined) { bad.add(key(r, c)); bad.add(key(seen[v])); }
      else seen[v] = key(r, c);
    }
  }

  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      cellEls[r][c].wrap.classList.toggle('conflict', bad.has(key(r, c)));
}

function hasConflicts(b) {
  for (let r = 0; r < SIZE; r++) {
    const seen = {};
    for (let c = 0; c < SIZE; c++) {
      const v = b[r][c]; if (!v) continue;
      if (seen[v]) return true; seen[v] = true;
    }
  }
  for (let c = 0; c < SIZE; c++) {
    const seen = {};
    for (let r = 0; r < SIZE; r++) {
      const v = b[r][c]; if (!v) continue;
      if (seen[v]) return true; seen[v] = true;
    }
  }
  for (let br = 0; br < 3; br++) for (let bc = 0; bc < 3; bc++) {
    const seen = {};
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
      const v = b[br*3+i][bc*3+j]; if (!v) continue;
      if (seen[v]) return true; seen[v] = true;
    }
  }
  return false;
}

/* ============================================================
   РЕШАТЕЛЬ
   ============================================================ */
function isValid(b, r, c, v) {
  for (let i = 0; i < SIZE; i++) {
    if (b[r][i] === v) return false;
    if (b[i][c] === v) return false;
  }
  const br = Math.floor(r / 3) * 3;
  const bc = Math.floor(c / 3) * 3;
  for (let i = 0; i < 3; i++)
    for (let j = 0; j < 3; j++)
      if (b[br + i][bc + j] === v) return false;
  return true;
}

function solve(b) {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (b[r][c] === 0) {
        for (let v = 1; v <= 9; v++) {
          if (isValid(b, r, c, v)) {
            b[r][c] = v;
            if (solve(b)) return true;
            b[r][c] = 0;
          }
        }
        return false;
      }
    }
  }
  return true;
}

/* ============================================================
   ОТРИСОВКА ПРЕДЫДУЩЕГО РЕШЕНИЯ
   ============================================================ */
function renderPreview() {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const el = previewEls[r][c];
      const v = lastSolution ? lastSolution[r][c] : 0;
      el.textContent = v ? String(v) : '';
    }
  }
  previewOverlay.classList.toggle('hidden', !!lastSolution);
}

/* ============================================================
   КНОПКА «РЕШИТЬ»
   ============================================================ */
document.getElementById('solveBtn').addEventListener('click', () => {
  statusEl.className = 'status';
  statusEl.textContent = '';

  if (hasConflicts(board)) {
    statusEl.className = 'status error';
    statusEl.textContent = 'В условии есть конфликты (одинаковые цифры в строке/столбце/блоке).';
    return;
  }

  const work = board.map(row => row.slice());
  const t0 = performance.now();
  const ok = solve(work);
  const dt = performance.now() - t0;

  if (!ok) {
    statusEl.className = 'status error';
    statusEl.textContent = 'Решение не найдено — возможно, в условии ошибка.';
    return;
  }

  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      board[r][c] = work[r][c];

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      cellEls[r][c].input.value = board[r][c] ? String(board[r][c]) : '';
      cellEls[r][c].wrap.classList.toggle('given', given[r][c]);
    }
  }

  lastSolution = work.map(row => row.slice());
  renderPreview();

  // Сбросить фокус и подсветку, чтобы не мозолили глаза синие полосы
  if (document.activeElement && document.activeElement.blur) {
    document.activeElement.blur();
  }
  selected = null;
  clearHighlight();

  checkConflicts();

  statusEl.className = 'status ok';
  statusEl.textContent = `Решено за ${dt.toFixed(1)} мс. Условия — чёрным, решение — зелёным.`;
});

/* ============================================================
   КНОПКА «ОЧИСТИТЬ»
   ============================================================ */
document.getElementById('clearBtn').addEventListener('click', () => {
  board = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  given = Array.from({length: SIZE}, () => Array(SIZE).fill(false));
  selected = null;
  clearHighlight();
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      cellEls[r][c].input.value = '';
      cellEls[r][c].wrap.classList.remove('given', 'conflict');
    }
  statusEl.className = 'status';
  statusEl.textContent = '';
  checkConflicts();
});

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
renderPreview();
checkConflicts();
cellEls[0][0].input.focus();
</script>
</body>
</html>
